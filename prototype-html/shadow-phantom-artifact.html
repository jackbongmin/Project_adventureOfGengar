<title>Shadow Phantom</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* layout: one centered game stage with a key legend underneath; a single dark look by choice */
:root{--bg:#0b0714;--panel:#160b2a;--fg:#e6d6ff;--muted:#9a82c0;--accent:#c58bff;--key:#2a1650;--keyline:#4a2a7a;color-scheme:dark}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.5 "Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
canvas{display:block;width:100%;height:auto;aspect-ratio:960/544;background:#000;border-radius:6px;outline:1px solid var(--keyline);cursor:pointer}
canvas:focus-visible{outline:2px solid var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;justify-content:center;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}
kbd{font:600 12px/1 ui-monospace,Consolas,monospace;background:var(--key);color:var(--fg);border:1px solid var(--keyline);border-bottom-width:3px;border-radius:4px;padding:5px 8px}
.note{text-align:center;color:var(--muted);margin:0}
</style>
<main>
<canvas id="c" width="960" height="544" tabindex="0" aria-label="Shadow Phantom 게임 화면"></canvas>
<div class="legend">
<span><kbd>←</kbd><kbd>→</kbd> 이동</span>
<span><kbd>C</kbd> 점프</span>
<span><kbd>Z</kbd> 섀도우볼</span>
<span><kbd>X</kbd> 필살기</span>
<span><kbd>Esc</kbd> 일시정지</span>
<span><kbd>Enter</kbd> 시작 · 선택</span>
</div>
<p class="note">게임 화면을 한 번 클릭한 뒤 키보드로 조작하세요. Space와 ↑도 점프로 쓸 수 있습니다. 적을 처치하면 필살기 게이지가 차오릅니다. PC 키보드 전용입니다.</p>
</main>
<script>

"use strict";
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 960, H = 544, T = 32;
const FONT = '"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif';
const BOSS_HP = 150;

/* ---------- input ---------- */
const keys = {}, pressed = {};
const JUMP = ['KeyC', 'Space', 'ArrowUp'];
const SHOOT = ['KeyZ'];
const ULT = ['KeyX'];
const BLOCK = ['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Enter', 'Tab'];
document.getElementById('c').addEventListener('pointerdown',()=>{document.getElementById('c').focus();initAudio();});
addEventListener('keydown', e => {
  if (BLOCK.includes(e.code)) e.preventDefault();
  if (!keys[e.code]) pressed[e.code] = true;
  keys[e.code] = true;
  initAudio();
});
addEventListener('keyup', e => {
  if (BLOCK.includes(e.code)) e.preventDefault();
  keys[e.code] = false;
});
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
const down = l => l.some(k => keys[k]);
const hit = l => l.some(k => pressed[k]);

/* ---------- audio ---------- */
let AC = null;
function initAudio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
}
function sfx(f, d = 0.1, type = 'square', slide = 0, vol = 0.05) {
  if (!AC) return;
  const t0 = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t0);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t0 + d);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
  o.connect(g); g.connect(AC.destination); o.start(); o.stop(t0 + d);
}

/* ---------- helpers ---------- */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);
const ov = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
function txt(s, x, y, size, color = '#fff', align = 'left') {
  ctx.font = `bold ${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'alphabetic';
  ctx.lineWidth = Math.max(3, size / 6); ctx.strokeStyle = 'rgba(8,0,20,.85)'; ctx.lineJoin = 'round';
  ctx.strokeText(s, x, y); ctx.fillStyle = color; ctx.fillText(s, x, y);
}

/* ---------- game data ---------- */
const ITEMS = [
  { k: 'power', name: '섀도우볼 위력', desc: '공격력 +1 (볼이 커짐)', max: 4, cost: [20, 35, 55, 80] },
  { k: 'rate',  name: '연사 속도',     desc: '발사 간격 단축',       max: 3, cost: [20, 35, 50] },
  { k: 'multi', name: '다중 발사',     desc: '섀도우볼 개수 +1',     max: 2, cost: [40, 80] },
  { k: 'hp',    name: '최대 체력',     desc: '하트 +1',              max: 4, cost: [20, 30, 45, 60] },
  { k: 'jump',  name: '부유 점프',     desc: '점프력 증가',          max: 3, cost: [15, 25, 40] },
  { k: 'speed', name: '이동 속도',     desc: '더 빠르게 이동',       max: 3, cost: [15, 25, 40] },
  { k: 'ult',   name: '필살기 강화',   desc: '필살기 위력 + 게이지 충전', max: 3, cost: [30, 50, 75] },
  { k: 'life',  name: '추가 목숨',     desc: '목숨 +1',              max: 3, cost: [40, 60, 80] },
  { k: 'next',  name: '다음 스테이지로 출발 →', desc: '', max: 0, cost: [] },
];
let state = 'title', G, L, P, enemies, boss, shots, eshots, parts, texts, coins, hearts, cam = { x: 0 };
let hazards = [], chunks = [], rings = [], flashT = 0, inUlt = false;
const CRUMBLE_FRAMES = 50, CRUMBLE_RESPAWN = 200; // 밟고 약 0.8초 뒤 추락, 약 3.3초 뒤 복구
let shake = 0, frameN = 0, clearT = 0, shopSel = 0, shopMsg = 0, banner = { text: '', t: 0 }, winT = 0;
const LEVEL_COUNT = 3;

function newGame() {
  G = { stage: 0, lives: 3, coins: 0, score: 0, snap: { coins: 0, score: 0 }, gauge: 0, up: { power: 0, rate: 0, multi: 0, hp: 0, jump: 0, speed: 0, life: 0, ult: 0 } };
}

/* ---------- levels ---------- */
function mkLevel(n) {
  const cfgs = [
    { w: 120, name: 'STAGE 1 · 안개 낀 들판' },
    { w: 150, name: 'STAGE 2 · 속삭이는 동굴' },
    { w: 30,  name: 'FINAL · 공허의 왕좌' },
  ];
  const w = cfgs[n].w, t = [];
  for (let y = 0; y < 17; y++) t.push(new Array(w).fill(y >= 15 ? 1 : 0));
  const L = { w, t, theme: n, name: cfgs[n].name, slimes: [], bats: [], hounds: [], casters: [], crumbs: [], cg: {}, coins: [], hearts: [], flag: null, boss: n === 2 };
  const crumble = (a, b, r) => {
    const g = { c0: a, c1: b, r, state: 'idle', t: 0 }; L.crumbs.push(g);
    for (let x = a; x <= b; x++) { t[r][x] = 4; L.cg[r * 1000 + x] = g; }
  };
  const hound = c => L.hounds.push({ x: c * T, y: 15 * T - 24 });
  const caster = c => L.casters.push({ x: c * T + 3, y: 15 * T - 32 });
  const pit = (a, b) => { for (let x = a; x <= b; x++) { t[15][x] = 0; t[16][x] = 0; } };
  const plat = (a, b, r) => { for (let x = a; x <= b; x++) t[r][x] = 2; };
  const spike = (a, b) => { for (let x = a; x <= b; x++) t[14][x] = 3; };
  const stack = (c, h) => { for (let k = 1; k <= h; k++) t[15 - k][c] = 2; };
  const slime = c => L.slimes.push({ x: c * T + 2, y: 15 * T - 22 });
  const bat = (c, r, range) => L.bats.push({ x: c * T, y: r * T, range });
  const coin = (c, r, k = 1) => { for (let i = 0; i < k; i++) L.coins.push({ x: (c + i) * T + 16, y: r * T + 16 }); };
  const arc = (c, r) => { [0, .8, 1.2, .8, 0].forEach((d, i) => L.coins.push({ x: (c + i) * T + 16, y: (r - d) * T + 16 })); };
  const heart = (c, r) => L.hearts.push({ x: c * T + 16, y: r * T + 16 });
  const flag = c => { L.flag = { x: c * T + 8, y: 10 * T, w: 16, h: 5 * T }; };

  if (n === 0) {
    [[26, 28], [50, 53], [74, 77], [96, 99]].forEach(p => pit(...p));
    plat(12, 15, 12); plat(34, 37, 12); plat(40, 43, 9); plat(60, 63, 12); plat(66, 69, 9); plat(84, 87, 12);
    [18, 31, 45, 57, 70, 82, 90, 102, 108].forEach(slime);
    [38, 80].forEach(caster);
    [48, 62, 94].forEach(hound);
    arc(25, 12); arc(49, 12); arc(73, 12); arc(95, 12);
    coin(12, 11, 4); coin(34, 11, 4); coin(40, 8, 4); coin(60, 11, 4); coin(66, 8, 4); coin(84, 11, 4);
    coin(5, 14, 3); coin(30, 14, 4); coin(46, 14, 3); coin(80, 14, 3); coin(108, 14, 4);
    heart(41, 8);
    stack(104, 1); stack(105, 2); stack(106, 3); stack(107, 4);
    flag(112);
  } else if (n === 1) {
    for (let x = 0; x < w; x++) { t[0][x] = 1; t[1][x] = 1; }
    [[20, 23], [40, 43], [62, 66], [85, 88], [105, 109], [124, 127]].forEach(p => pit(...p));
    crumble(21, 22, 13); crumble(41, 42, 13); crumble(63, 65, 13); crumble(86, 87, 13); crumble(106, 108, 13); crumble(125, 126, 13);
    [37, 56, 78, 102, 121].forEach(caster);
    [25, 45, 60, 92, 113, 131].forEach(hound);
    plat(13, 16, 12); plat(46, 49, 12); plat(48, 51, 9); plat(68, 71, 12); plat(90, 93, 12); plat(92, 95, 9); plat(112, 115, 12); plat(130, 133, 12);
    spike(30, 32); spike(52, 54); spike(74, 76); spike(97, 99); spike(117, 119);
    [12, 27, 35, 47, 58, 70, 80, 91, 101, 112, 121, 135].forEach(slime);
    [[15, 9, 100], [37, 8, 100], [56, 8, 110], [79, 8, 100], [98, 8, 100], [118, 8, 100], [138, 9, 100]].forEach(b => bat(...b));
    arc(20, 11); arc(40, 12); arc(62, 9); arc(85, 12); arc(105, 9); arc(124, 12);
    coin(13, 11, 4); coin(46, 11, 4); coin(48, 8, 4); coin(68, 11, 4); coin(92, 8, 4); coin(112, 11, 4); coin(130, 11, 4);
    coin(6, 14, 3); coin(28, 14, 2); coin(60, 14, 2); coin(100, 14, 3);
    heart(50, 8); heart(131, 11);
    stack(139, 1); stack(140, 2); stack(141, 3); stack(142, 4); stack(143, 5);
    flag(147);
  } else {
    for (let y = 0; y < 17; y++) { t[y][0] = 1; t[y][w - 1] = 1; }
    plat(4, 7, 12); plat(22, 25, 12); plat(12, 17, 9);
    heart(5, 11); heart(23, 11);
    coin(13, 8, 4);
  }
  return L;
}

/* ---------- entities ---------- */
function mkPlayer() {
  return { x: 2 * T, y: 13 * T, w: 22, h: 30, vx: 0, vy: 0, dir: 1, ground: false, coyote: 0, jbuf: 0, inv: 0, cd: 0,
           hp: 3 + G.up.hp, dead: false, deadT: 0, anim: 0 };
}
const mkSlime = (x, y) => { const s = G.stage; return { type: 'slime', x, y, w: 28, h: 22, vx: -(0.8 + s * 0.2), vy: 0, hp: 2 + s, flash: 0, onG: false }; };
const mkBat = (x, y, range = 90) => ({ type: 'bat', x, y, w: 26, h: 20, x0: x, y0: y, range, ph: rand(0, 6), hp: 1 + G.stage, flash: 0, t: 0, dir: 1 });
const mkHound = (x, y) => { const s = G.stage; return { type: 'hound', x, y, w: 34, h: 24, vx: 0, vy: 0, dir: -1, hp: 3 + s, flash: 0, onG: false, aggro: false }; };
const mkCaster = (x, y) => { const s = G.stage; return { type: 'caster', x, y, w: 26, h: 32, vy: 0, dir: -1, hp: 2 + s, flash: 0, cd: 80 + Math.floor(rand(0, 40)), onG: false }; };
function mkBoss() {
  return { cx: W / 2, cy: -120, hp: BOSS_HP, max: BOSS_HP, state: 'enter', sub: 0, t: 0, tt: 0, flash: 0, phase: 0, atkIdx: 0, n: 0,
           lookX: 0, lookY: 0, charge: 0, vy: 0, invul: true, alpha: 1, beam: null, atkName: '', atkT: 0 };
}
const bossBox = b => ({ x: b.cx - 52, y: b.cy - 52, w: 104, h: 104 });

function startStage(retry = false) {
  L = mkLevel(G.stage);
  P = mkPlayer();
  enemies = L.slimes.map(s => mkSlime(s.x, s.y)).concat(L.bats.map(b => mkBat(b.x, b.y, b.range)))
    .concat(L.hounds.map(h => mkHound(h.x, h.y))).concat(L.casters.map(c => mkCaster(c.x, c.y)));
  hazards = []; chunks = []; rings = []; flashT = 0;
  coins = L.coins.map(c => ({ ...c, got: false }));
  hearts = L.hearts.map(h => ({ ...h, got: false }));
  boss = L.boss ? mkBoss() : null;
  shots = []; eshots = []; parts = []; texts = [];
  cam.x = 0; shake = 0; clearT = 0;
  if (!retry) G.snap = { coins: G.coins, score: G.score };
  banner = { text: L.name, t: 150 };
  state = 'play';
}

/* ---------- tile collision ---------- */
function tile(c, r) { if (c < 0 || c >= L.w) return 1; if (r < 0 || r >= 17) return 0; return L.t[r][c]; }
function solid(c, r) { const v = tile(c, r); return v === 1 || v === 2 || v === 4; }
// 앞이 낭떠러지이거나 가시면 true (바닥에 있을 때만 낭떠러지 판정)
function aheadBlocked(e, dir) {
  const col = Math.floor((dir > 0 ? e.x + e.w + 2 : e.x - 2) / T);
  if (tile(col, Math.floor((e.y + e.h - 2) / T)) === 3) return true;
  return e.onG && !solid(col, Math.floor((e.y + e.h + 4) / T));
}
function moveX(e, dx) {
  e.x += dx;
  const r0 = Math.floor(e.y / T), r1 = Math.floor((e.y + e.h - 0.01) / T);
  if (dx > 0) { const c = Math.floor((e.x + e.w - 0.01) / T); for (let r = r0; r <= r1; r++) if (solid(c, r)) { e.x = c * T - e.w; return true; } }
  else if (dx < 0) { const c = Math.floor(e.x / T); for (let r = r0; r <= r1; r++) if (solid(c, r)) { e.x = (c + 1) * T; return true; } }
  return false;
}
function moveY(e, dy) {
  e.y += dy;
  const c0 = Math.floor(e.x / T), c1 = Math.floor((e.x + e.w - 0.01) / T);
  if (dy > 0) { const r = Math.floor((e.y + e.h - 0.01) / T); for (let c = c0; c <= c1; c++) if (solid(c, r)) { e.y = r * T - e.h; return 'down'; } }
  else if (dy < 0) { const r = Math.floor(e.y / T); for (let c = c0; c <= c1; c++) if (solid(c, r)) { e.y = (r + 1) * T; return 'up'; } }
  return null;
}

/* ---------- fx ---------- */
function burst(x, y, n, col, sp = 3, life = 30) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, 6.283), s = rand(0.3, 1) * sp;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1, life: life * rand(0.5, 1), max: life, col, sz: rand(2, 5) });
  }
}
function tickFx() {
  parts = parts.filter(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.1; p.vx *= 0.98; return --p.life > 0; });
  texts = texts.filter(t => { t.y -= 0.6; return --t.life > 0; });
  rings = rings.filter(r => { r.r += 22; return --r.life > 0; }); if (flashT > 0) flashT--;
  chunks = chunks.filter(c => { c.vy += 0.5; c.y += c.vy; c.rot += c.vr; return c.y < H + 60; });
  shake *= 0.88; if (shake < 0.3) shake = 0;
}
const pop = (x, y, s, color = '#fff') => texts.push({ x, y, s, color, life: 45 });

/* ---------- player ---------- */
function hurtP(dir) {
  if (P.inv > 0 || P.dead) return;
  P.hp--; P.inv = 100; P.vy = -6; P.vx = dir * 5; shake = 8;
  sfx(180, 0.25, 'sawtooth', -120, 0.07);
  burst(P.x + P.w / 2, P.y + P.h / 2, 12, '#c58bff', 4);
  if (P.hp <= 0) killP();
}
function killP() {
  if (P.dead) return;
  P.dead = true; P.deadT = 0; shake = 12;
  burst(P.x + P.w / 2, P.y + P.h / 2, 40, '#b36bff', 6, 50);
  sfx(300, 0.6, 'sawtooth', -250, 0.07);
}
function fire() {
  const n = 1 + G.up.multi, offs = n === 1 ? [0] : n === 2 ? [-0.7, 0.7] : [-1.5, 0, 1.5];
  offs.forEach(o => shots.push({
    x: P.x + P.w / 2 + P.dir * 14, y: P.y + 15, vx: P.dir * 8, vy: o, r: 7 + G.up.power * 1.3,
    dmg: 1 + G.up.power, life: 36 + G.up.power * 3, t: 0,
  }));
  P.cd = Math.max(9, 24 - G.up.rate * 5);
  sfx(520, 0.14, 'sine', -300, 0.06);
}
function updatePlayer() {
  const p = P, spd = 3.4 + G.up.speed * 0.45;
  let ax = 0;
  if (keys.ArrowLeft) ax--; if (keys.ArrowRight) ax++;
  if (ax) { p.vx += ax * 0.55; p.dir = ax; } else p.vx *= p.ground ? 0.78 : 0.93;
  p.vx = clamp(p.vx, -spd, spd); if (!ax && Math.abs(p.vx) < 0.05) p.vx = 0;

  if (hit(JUMP)) p.jbuf = 7; else p.jbuf = Math.max(0, p.jbuf - 1);
  p.coyote = p.ground ? 6 : Math.max(0, p.coyote - 1);
  if (p.jbuf > 0 && p.coyote > 0) { p.vy = -(11.8 + G.up.jump * 0.9); p.jbuf = 0; p.coyote = 0; p.ground = false; sfx(330, 0.18, 'sine', 300, 0.05); }
  if (!down(JUMP) && p.vy < -3.5) p.vy *= 0.8;

  p.vy = Math.min(p.vy + 0.55, 12);
  if (moveX(p, p.vx)) p.vx = 0;
  const r = moveY(p, p.vy);
  if (r === 'down') { p.vy = 0; p.ground = true; } else { if (r === 'up') p.vy = 0; p.ground = false; }
  if (p.y > 17 * T + 40) killP();

  if (p.cd > 0) p.cd--;
  if (down(SHOOT) && p.cd <= 0) fire();
  if (hit(ULT) && G.gauge >= 100) ult();
  if (p.inv > 0) p.inv--;
  p.anim++;

  // spikes
  const c0 = Math.floor((p.x + 3) / T), c1 = Math.floor((p.x + p.w - 3) / T), r1 = Math.floor((p.y + p.h - 1) / T);
  for (let c = c0; c <= c1; c++) if (tile(c, r1) === 3 && p.y + p.h > r1 * T + 14) hurtP(-p.dir);
  // flag
  if (L.flag && ov(p, L.flag) && !p.dead) {
    state = 'clear'; clearT = 0; G.score += 500 + p.hp * 100;
    sfx(660, 0.5, 'triangle', 600, 0.07); burst(p.x, p.y, 40, '#ffe27a', 6, 60);
  }
}

/* ---------- enemies ---------- */
function addGauge(n) { if (!inUlt) G.gauge = Math.min(100, G.gauge + n * (1 + G.up.ult * 0.25)); }
function ult() {
  G.gauge = 0; inUlt = true;
  const dmg = 6 + G.up.ult * 3 + G.up.power * 2;
  enemies.forEach(e => { if (!e.dead && e.x + e.w > cam.x - 40 && e.x < cam.x + W + 40) damageEnemy(e, dmg); });
  if (boss) damageBoss(boss, 20 + G.up.ult * 8);
  inUlt = false;
  eshots = []; P.inv = Math.max(P.inv, 70); shake = 16; flashT = 14;
  rings.push({ x: P.x + P.w / 2, y: P.y + P.h / 2, r: 10, life: 36 });
  burst(P.x + P.w / 2, P.y + P.h / 2, 60, '#c58bff', 9, 40);
  sfx(70, 0.7, 'sawtooth', -30, 0.09); sfx(400, 0.5, 'triangle', 700, 0.06);
}
function damageEnemy(e, d) {
  addGauge(e.hp - d <= 0 ? 15 : 4);
  e.hp -= d; e.flash = 6; pop(e.x + e.w / 2, e.y, '-' + Math.round(d));
  sfx(240, 0.08, 'square', -100, 0.05);
  if (e.hp <= 0 && !e.dead) {
    e.dead = true; G.score += 100; G.coins += 3;
    burst(e.x + e.w / 2, e.y + e.h / 2, 18, { bat: '#ff6a8a', slime: '#6df0a0', hound: '#8a5cd0', caster: '#ff5ca8' }[e.type], 4);
    pop(e.x + e.w / 2, e.y - 12, '+3', '#ffe27a');
    if (Math.random() < 0.12) hearts.push({ x: e.x + e.w / 2, y: e.y + e.h / 2, got: false });
    sfx(700, 0.15, 'triangle', 400, 0.05);
  }
}
function updateEnemy(e) {
  if (e.flash > 0) e.flash--;
  if (e.type === 'slime') {
    e.vy = Math.min(e.vy + 0.5, 10);
    const wall = moveX(e, e.vx);

/* ---------- shop ---------- */
function itemPrice(it) { const lv = G.up[it.k] || 0; return lv >= it.max ? null : it.cost[lv]; }

    const price = itemPrice(it);

      G.coins -= price; G.up[it.k]++; if (it.k === 'life') G.lives++;

/* ---------- update ---------- */
function update() {
  frameN++;
  if (state === 'title') { if (hit(['Enter'])) { newGame(); startStage(); } return; }
  if (state === 'over') { if (hit(['Enter'])) state = 'title'; return; }
  if (state === 'win') { winT++; if (hit(['Enter']) && winT > 30) state = 'title'; tickFx(); return; }
  if (state === 'shop') { updateShop(); return; }
  if (state === 'pause') { if (hit(['Escape', 'KeyP'])) state = 'play'; return; }
  if (state === 'play' && hit(['Escape', 'KeyP'])) { state = 'pause'; return; }
  if (state === 'clear') { clearT++; tickFx(); if (clearT > 170) { state = 'shop'; shopSel = 0; shopMsg = 0; } return; }

  if (banner.t > 0) banner.t--;
  if (P.dead) {
    P.deadT++; tickFx();
    if (P.deadT > 110) {
      G.lives--;
      if (G.lives <= 0) state = 'over';
      else { G.coins = G.snap.coins; G.score = G.snap.score; startStage(true); }
    }
    return;
  }
  updatePlayer();
  if (state !== 'play') return;
  updateCrumbs();
  enemies.forEach(updateEnemy);
  enemies = enemies.filter(e => !e.dead);
  if (boss) updateBoss(boss);
  updateShots();
  updateItems();
  tickFx();
  cam.x += (clamp(P.x + P.w / 2 - W / 2 + P.dir * 40, 0, Math.max(0, L.w * T - W)) - cam.x) * 0.12;
}

    if (s.k === 'orb') {
      let g = ctx.createRadialGradient(x, s.y, 1, x, s.y, s.r * 2); g.addColorStop(0, 'rgba(255,60,140,.7)'); g.addColorStop(1, 'rgba(255,60,140,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, s.y, s.r * 2, 0, 7); ctx.fill();
      ctx.fillStyle = '#ff5ca8'; ctx.beginPath(); ctx.arc(x, s.y, s.r, 0, 7); ctx.fill(); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x, s.y, s.r * 0.4, 0, 7); ctx.fill();
    } else {
      const d = Math.sign(s.vx); ctx.fillStyle = '#c58bff'; ctx.beginPath(); ctx.moveTo(x - d * 14, s.y + 11); ctx.lineTo(x + d * 4, s.y - 12); ctx.lineTo(x + d * 14, s.y + 11); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(x - d * 5, s.y + 11); ctx.lineTo(x + d * 4, s.y - 3); ctx.lineTo(x + d * 8, s.y + 11); ctx.fill();
    }
  });
  parts.forEach(p => { ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.col; ctx.fillRect(p.x - cam.x - p.sz / 2, p.y - p.sz / 2, p.sz, p.sz); });
  ctx.globalAlpha = 1;
  texts.forEach(t => { ctx.globalAlpha = Math.min(1, t.life / 20); txt(t.s, t.x - cam.x, t.y, 16, t.color, 'center'); });
  ctx.globalAlpha = 1;
  ctx.restore();
}
function drawHUD() {
  ctx.fillStyle = 'rgba(10,0,25,.55)'; ctx.fillRect(0, 0, W, 44);
  const mx = 3 + G.up.hp;
  for (let i = 0; i < mx; i++) drawHeart(26 + i * 28, 22, 1.25, i < P.hp);
  txt('목숨 ×' + G.lives, 26 + mx * 28 + 10, 29, 18, '#d9c2ff');
  txt('◆ ' + G.coins, 480, 29, 18, '#ffe27a', 'center');
  const full = G.gauge >= 100, gx = 600, gw = 130;
  txt(full ? 'X 필살기!' : '필살기', gx - 8, 29, 15, full ? '#ffe27a' : '#b8a2dd', 'right');
  ctx.fillStyle = 'rgba(0,0,0,.7)'; ctx.fillRect(gx - 2, 14, gw + 4, 18);
  ctx.fillStyle = full ? `hsl(${290 + Math.sin(frameN * 0.2) * 30},100%,70%)` : '#7b3fd0'; ctx.fillRect(gx, 16, gw * G.gauge / 100, 14);
  txt('SCORE ' + String(G.score).padStart(6, '0'), W - 20, 29, 18, '#fff', 'right');
  if (boss && boss.state !== 'dying') {
    const bw = 520, bx = (W - bw) / 2, by = 56;
    txt('공허의 군주 · VOIDMAW', W / 2, by - 4, 16, '#ffd0ff', 'center');
    ctx.fillStyle = 'rgba(0,0,0,.7)'; ctx.fillRect(bx - 3, by, bw + 6, 16);
    const r = boss.hp / boss.max;
    ctx.fillStyle = ['#a24bff', '#e04bd0', '#ff3c5c'][boss.phase]; ctx.fillRect(bx, by + 3, bw * r, 10);
    ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.fillRect(bx + bw * 0.33, by, 2, 16); ctx.fillRect(bx + bw * 0.66, by, 2, 16);
    if (boss.atkT > 0 && boss.atkName) { ctx.globalAlpha = Math.min(1, boss.atkT / 20); txt(boss.atkName, W / 2, by + 38, 20, '#ff9ad0', 'center'); ctx.globalAlpha = 1; }
  }
  if (banner.t > 0) {
    ctx.globalAlpha = Math.min(1, banner.t / 40);
    txt(banner.text, W / 2, 190, 40, '#f0dcff', 'center');
    if (L.boss && boss && boss.state === 'enter') txt('공허의 군주가 모습을 드러낸다...', W / 2, 230, 20, '#ff9ad0', 'center');
    ctx.globalAlpha = 1;
  }
}
function drawTitle() {
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#0e0420'); g.addColorStop(1, '#3a1260'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 80; i++) { ctx.fillStyle = `rgba(255,255,255,${0.3 + 0.5 * Math.sin(frameN * 0.04 + i)})`; ctx.fillRect((i * 151) % W, (i * 67) % 400, 2, 2); }
  drawPhantom(W / 2, 205, 1, frameN, 3.2);
  txt('SHADOW PHANTOM', W / 2, 340, 54, '#d9b8ff', 'center');
  txt('섀도우 팬텀 — 공허의 군주를 쓰러뜨려라', W / 2, 372, 20, '#ffffff', 'center');
  txt('← → 이동  |  C 점프  |  Z 섀도우볼  |  X 필살기  |  Esc 일시정지', W / 2, 425, 18, '#c9b0ee', 'center');
  txt('(Space/↑ 도 점프로 사용 가능 · 적을 처치해 게이지를 채우세요)', W / 2, 450, 14, '#9a82c0', 'center');
  if (Math.floor(frameN / 30) % 2) txt('Enter 를 눌러 시작', W / 2, 500, 24, '#ffe27a', 'center');
}
function drawShop() {
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#12062a'); g.addColorStop(1, '#2d0f4f'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  txt('영혼 상점', 50, 56, 36, '#d9b8ff');
  txt('◆ ' + G.coins, W - 50, 56, 30, '#ffe27a', 'right');
  txt('↑↓ 선택   Enter/Z 구매', 50, 82, 15, '#9a82c0');
  ITEMS.forEach((it, i) => {
    const y = 105 + i * 46, sel = i === shopSel;
    ctx.fillStyle = sel ? 'rgba(160,90,255,.35)' : 'rgba(255,255,255,.06)'; ctx.fillRect(40, y, 590, 40);
    if (sel) { ctx.strokeStyle = '#c58bff'; ctx.lineWidth = 2; ctx.strokeRect(40, y, 590, 40); }
    if (it.k === 'next') { txt(it.name, 60, y + 28, 20, sel ? '#ffe27a' : '#fff'); return; }
    const lv = G.up[it.k], price = itemPrice(it);
    txt(it.name, 60, y + 26, 18, '#fff');
    txt(it.desc, 235, y + 26, 14, '#b8a2dd');
    for (let k = 0; k < it.max; k++) { ctx.fillStyle = k < lv ? '#c58bff' : 'rgba(255,255,255,.18)'; ctx.fillRect(425 + k * 14, y + 15, 10, 10); }
    const can = price !== null && G.coins >= price;
    txt(price === null ? 'MAX' : '◆ ' + price, 615, y + 27, 18, price === null ? '#9a82c0' : can ? '#ffe27a' : '#ff6a8a', 'right');
  });
  if (shopMsg > 0) txt('코인이 부족하거나 최대 단계입니다', 335, 533, 16, '#ff6a8a', 'center');
  ctx.fillStyle = 'rgba(255,255,255,.07)'; ctx.fillRect(660, 105, 260, 300);
  drawPhantom(790, 175, 1, frameN, 2);
  const u = G.up, lines = [
    '공격력  ' + (1 + u.power), '발사 수  ' + (1 + u.multi), '발사 간격  ' + Math.max(9, 24 - u.rate * 5) + 'f',
    '최대 체력  ' + (3 + u.hp), '점프력  Lv.' + u.jump, '이동속도  Lv.' + u.speed, '필살기  Lv.' + u.ult, '목숨  ' + G.lives,
  ];
  lines.forEach((s, i) => txt(s, 690, 245 + i * 23, 16, '#e6d6ff'));
  const nxt = G.stage + 1;
  txt(nxt === 2 ? '다음: 최종 보스전!' : '다음: STAGE ' + (nxt + 1), 790, 430, 18, nxt === 2 ? '#ff7aa8' : '#d9c2ff', 'center');
}
function render() {
  ctx.clearRect(0, 0, W, H);
  if (state === 'title') return drawTitle();
  if (state === 'shop') return drawShop();
  if (state === 'over') {
    ctx.fillStyle = '#0a0214'; ctx.fillRect(0, 0, W, H);
    txt('GAME OVER', W / 2, 240, 64, '#ff6a8a', 'center'); txt('SCORE ' + G.score, W / 2, 300, 28, '#fff', 'center');
    if (Math.floor(frameN / 30) % 2) txt('Enter — 타이틀로', W / 2, 380, 22, '#ffe27a', 'center'); return;
  }
  drawWorld();
  if (flashT > 0) { ctx.fillStyle = `rgba(230,200,255,${flashT / 14 * 0.55})`; ctx.fillRect(0, 0, W, H); }
  drawHUD();
  if (state === 'clear') { ctx.fillStyle = 'rgba(10,0,25,.45)'; ctx.fillRect(0, 0, W, H); txt('STAGE CLEAR!', W / 2, 250, 56, '#ffe27a', 'center'); }
  if (state === 'pause') { ctx.fillStyle = 'rgba(10,0,25,.6)'; ctx.fillRect(0, 0, W, H); txt('PAUSE', W / 2, 260, 56, '#fff', 'center'); txt('Esc 로 계속', W / 2, 300, 20, '#c9b0ee', 'center'); }
  if (P.dead && P.deadT > 20) { ctx.fillStyle = `rgba(10,0,25,${Math.min(.6, (P.deadT - 20) / 80)})`; ctx.fillRect(0, 0, W, H); }
  if (state === 'win') {
    ctx.fillStyle = `rgba(10,0,25,${Math.min(.85, winT / 60)})`; ctx.fillRect(0, 0, W, H);
    if (winT > 20) {
      drawPhantom(W / 2, 150, 1, frameN, 2.6);
      txt('VICTORY!', W / 2, 270, 64, '#ffe27a', 'center');
      txt('공허의 군주를 쓰러뜨렸다. 어둠에 평화가 돌아왔다.', W / 2, 315, 22, '#fff', 'center');
      txt('FINAL SCORE  ' + G.score, W / 2, 375, 34, '#d9b8ff', 'center');
      if (Math.floor(frameN / 30) % 2) txt('Enter — 타이틀로', W / 2, 450, 22, '#ffe27a', 'center');
    }
  }
}

/* ---------- loop ---------- */
let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; for (const k in pressed) delete pressed[k]; }
  render();
  requestAnimationFrame(loop);
}
newGame(); G.stage = 0; // dummy so render helpers never see undefined
requestAnimationFrame(loop);

</script>
